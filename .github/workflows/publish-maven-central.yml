name: Maven Central - Upload StateUpdater (manual approval)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ENVIAR-STATEUPDATER to upload a signed deployment to Sonatype'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stateupdater-central-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Upload signed StateUpdater artifacts (Sonatype manual release)
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ENVIAR-STATEUPDATER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central

    steps:
      - name: Checkout approved main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the requested release coordinates are not already on Maven Central
        shell: bash
        run: |
          set -euo pipefail
          for artifact in 'common:0.1.1' 'block-updater:1.26.60-R1' 'item-updater:1.26.50-R1'; do
            name="${artifact%%:*}"
            version="${artifact##*:}"
            url="https://repo.maven.apache.org/maven2/io/github/ryzemcbe/$name/$version/$name-$version.pom"
            status=$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "$url")
            if [[ "$status" == '200' ]]; then
              echo "::error::$name:$version already exists on Maven Central. Release versions are immutable."
              exit 1
            elif [[ "$status" != '404' ]]; then
              echo "::error::Unexpected Maven Central HTTP status $status for $name:$version"
              exit 1
            fi
            echo "$name:$version is not currently published on Maven Central"
          done

      - name: Compile, test, sign and validate publication POMs
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          chmod +x ./gradlew
          ./gradlew clean build \
            :common:generatePomFileForMavenPublication \
            :block-updater:generatePomFileForMavenPublication \
            :item-updater:generatePomFileForMavenPublication \
            :common:signMavenPublication \
            :block-updater:signMavenPublication \
            :item-updater:signMavenPublication \
            -PcentralRelease=true --no-daemon
          python3 .github/scripts/verify-central-poms.py
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:common:0.1.1 \
            common/build/publications/maven/pom-default.xml \
            block-updater/build/publications/maven/pom-default.xml \
            item-updater/build/publications/maven/pom-default.xml

      - name: Upload signed artifacts to Sonatype Central (DO NOT auto-release)
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          ./gradlew publishToMavenCentral -PcentralRelease=true --no-daemon

      - name: Next step - check validation and manually publish in Sonatype
        run: |
          echo "The deployment was UPLOADED for Sonatype validation; not auto-released."
          echo "Open https://central.sonatype.com/publishing/deployments"
          echo "Review the complete deployment, and press Publish only if VALIDATED."
