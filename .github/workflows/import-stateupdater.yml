name: Import StateUpdater source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-stateupdater.yml

permissions:
  contents: write

concurrency:
  group: stateupdater-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract archive
        shell: bash
        run: |
          python3 - <<'PY'
          import shutil
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("StateUpdater-master.zip")
          if not archive.exists():
              raise SystemExit("Missing StateUpdater-master.zip")
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt zip entry: {bad}")
              files = [info for info in zf.infolist() if not info.is_dir()]
              if not files or len(files) > 30000:
                  raise SystemExit("Unexpected file count")
              if sum(info.file_size for info in files) > 500_000_000:
                  raise SystemExit("Uncompressed content too large")
              paths = []
              for info in files:
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or ".git" in path.parts or ":" in path.parts[0] or "\x00" in name:
                      raise SystemExit(f"Unsafe path: {name}")
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not supported in archive: {name}")
                  if info.file_size > 90_000_000:
                      raise SystemExit(f"Large archive file: {name}")
                  paths.append(path)

              prefixes = {p.parts[0] for p in paths if len(p.parts) > 1}
              flatten = len(prefixes) == 1 and all(len(p.parts) > 1 for p in paths)
              outputs = [PurePosixPath(*p.parts[1:]) if flatten else p for p in paths]
              if len(set(outputs)) != len(outputs):
                  raise SystemExit("Duplicate output paths")
              with tempfile.TemporaryDirectory(prefix="stateupdater-") as tmp_dir:
                  root = Path(tmp_dir)
                  for info, relative in zip(files, outputs):
                      # GitHub Actions token cannot create workflows; preserve them as documentation.
                      if relative.parts[:2] == (".github", "workflows"):
                          relative = PurePosixPath("imported-workflows", relative.name)
                      target = root.joinpath(*relative.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if target.exists():
                          raise SystemExit(f"Duplicate extraction target: {relative}")
                      with zf.open(info) as source, target.open("wb") as destination:
                          shutil.copyfileobj(source, destination)
                      if info.external_attr >> 16 & 0o111:
                          target.chmod(0o755)
                  for source in root.rglob("*"):
                      if not source.is_file():
                          continue
                      target = Path.cwd() / source.relative_to(root)
                      if target.exists():
                          raise SystemExit(f"Existing file: {target}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.move(str(source), str(target))
              print(f"Extracted {len(files)} files")
          PY

      - name: Commit source and remove zip
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- StateUpdater-master.zip
          git add -A
          git commit -m "chore: unpack StateUpdater source and remove archive"
          git push origin HEAD:main
