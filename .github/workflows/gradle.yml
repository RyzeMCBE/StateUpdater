name: Engine StateUpdater · Compilación

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stateupdater-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Validar POMs Maven Central (sin publicar)
        run: |
          ./gradlew \
            :common:generatePomFileForMavenPublication \
            :block-updater:generatePomFileForMavenPublication \
            :item-updater:generatePomFileForMavenPublication \
            -PcentralRelease=true --no-daemon
          python3 .github/scripts/verify-central-poms.py
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:common:0.1.1 \
            common/build/publications/maven/pom-default.xml \
            block-updater/build/publications/maven/pom-default.xml \
            item-updater/build/publications/maven/pom-default.xml

      - name: Guardar JAR de StateUpdater
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-stateupdater-${{ github.sha }}
          path: |
            common/build/libs/*.jar
            block-updater/build/libs/*.jar
            item-updater/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
