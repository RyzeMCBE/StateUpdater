name: Maven Central - Verify GPG signatures (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stateupdater-central-signing
  cancel-in-progress: false

jobs:
  verify-signing:
    name: Verify signed Maven artifacts (without publishing)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: maven-central
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Maven Central signing secrets are present
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "$PRIVATE_KEY" || -z "$PASSPHRASE" ]]; then
            echo "::error::Missing GPG_PRIVATE_KEY or GPG_PASSPHRASE in maven-central environment"
            exit 1
          fi

      - name: Compile, test, generate POMs and sign all 3 Maven publications
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build \
            :common:generatePomFileForMavenPublication \
            :block-updater:generatePomFileForMavenPublication \
            :item-updater:generatePomFileForMavenPublication \
            :common:signMavenPublication \
            :block-updater:signMavenPublication \
            :item-updater:signMavenPublication \
            -PcentralRelease=true --no-daemon

      - name: Verify POM metadata and Central dependency availability
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-central-poms.py
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:common:0.1.1 \
            common/build/publications/maven/pom-default.xml \
            block-updater/build/publications/maven/pom-default.xml \
            item-updater/build/publications/maven/pom-default.xml

      - name: Verify detached signature outputs are present
        shell: bash
        run: |
          set -euo pipefail
          for module in common block-updater item-updater; do
            count=$(find "$module/build" -type f -name '*.asc' | wc -l)
            if [[ "$count" -lt 2 ]]; then
              echo "::error::$module: expected at least two detached signature files; found $count"
              exit 1
            fi
            echo "$module: $count signature files generated"
          done
          echo "GPG signing passed. NO artifacts were published to Sonatype."
